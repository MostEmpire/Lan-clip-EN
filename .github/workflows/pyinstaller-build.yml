name: Python package

on: [push]

jobs:
  build-ubuntu-executable:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    -   uses: actions/checkout@v4
    -   name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
            python-version: ${{ matrix.python-version }}
    # You can test your matrix by printing the current Python version
    -   name: install pip requirements
        run: |
            pip install -r requirements.txt
    -   name: build by cmd
        run: |
            pyinstaller --name=LAN_clipboard_app --add-data "templates:templates" --add-data "static:static" app.py -y
    -   name: Copy artifacts
        uses: actions/upload-artifact@v4
        with:
            name: lanclip-ubuntu-x64
            path: dist/


  build-win-executable:
        runs-on: windows-2022
        strategy:
            matrix:
              python-version: ["3.10"]
        steps:
        -   uses: actions/checkout@v4
        -   name: Set up Python ${{ matrix.python-version }}
            uses: actions/setup-python@v5
            with:
                python-version: ${{ matrix.python-version }}
        # You can test your matrix by printing the current Python version
        -   name: install pip requirements
            run: |
                pip install -r requirements.txt
        -   name: build by cmd
            # --windowed builds a no-console executable. The app defaults to tray mode
            # when frozen, so LAN_clipboard_app.exe runs silently in the tray on its own.
            # This drops the separate --onefile --noconsole "start.exe" loader and the
            # hidden-window launch pattern that AV engines flagged.
            run: |
                pyinstaller --name=LAN_clipboard_app --windowed --version-file build-script/version_info.txt --add-data "templates;templates" --add-data "static;static" app.py -y
        -   name: Code sign executables (optional)
            shell: pwsh
            env:
                WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
                WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
            run: |
                if (-not $env:WINDOWS_CERT_BASE64) {
                    Write-Host "No signing certificate configured (secrets.WINDOWS_CERT_BASE64 absent); skipping code signing."
                    exit 0
                }
                $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
                [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
                $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
                Get-ChildItem -Path dist -Recurse -Filter *.exe | ForEach-Object {
                    & $signtool.FullName sign /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
                    if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.FullName)" }
                }
                Remove-Item $pfxPath -Force
        -   name: Copy artifacts
            uses: actions/upload-artifact@v4
            with:
                name: lanclip-windows-x64
                path: dist/
                
  build-macos-executable:
        runs-on: macos-15
        strategy:
            matrix:
                python-version: ["3.10"]
        steps:
        -   uses: actions/checkout@v4
        -   name: Set up Python ${{ matrix.python-version }}
            uses: actions/setup-python@v5
            with:
                python-version: ${{ matrix.python-version }}
        # You can test your matrix by printing the current Python version
        -   name: install pip requirements
            run: |
                pip install -r requirements.txt
        -   name: build by cmd
            run: |
                pyinstaller --name=LAN_clipboard_app --add-data "templates:templates" --add-data "static:static" app.py -y
        -   name: Copy artifacts
            uses: actions/upload-artifact@v4
            with:
                name: lanclip-macos-m1
                path: dist/
                    
